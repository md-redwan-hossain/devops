# =============================================================================
# POSTGRESQL DEFAULT CONFIG
# =============================================================================

data_directory = '/var/lib/postgresql/18/main'
hba_file = '/etc/postgresql/18/main/pg_hba.conf'
ident_file = '/etc/postgresql/18/main/pg_ident.conf'
external_pid_file = '/var/run/postgresql/18-main.pid'
listen_addresses = '*'
port = 5432
unix_socket_directories = '/var/run/postgresql'
ssl = on
ssl_cert_file = '/etc/ssl/certs/ssl-cert-snakeoil.pem'
ssl_key_file = '/etc/ssl/private/ssl-cert-snakeoil.key'
dynamic_shared_memory_type = posix
log_line_prefix = '%m [%p] %q%u@%d '
log_timezone = 'Asia/Dhaka'
cluster_name = '18/main'
autovacuum_worker_slots = 16
datestyle = 'iso, mdy'
timezone = 'Asia/Dhaka'
lc_messages = 'en_US.UTF-8'
lc_monetary = 'en_US.UTF-8'
lc_numeric = 'en_US.UTF-8'
lc_time = 'en_US.UTF-8'
default_text_search_config = 'pg_catalog.english'
include_dir = 'conf.d'


# =============================================================================
# WARNING: wal_compression = lz4 requires --with-lz4
# WARNING: io_method = io_uring requires --with-liburing
# =============================================================================

# max client connections
max_connections = 200

# 25% of 5GB — PostgreSQL's main buffer pool
shared_buffers = 1280MB

# 75% of 5GB — planner hint for OS cache
effective_cache_size = 3840MB

# memory for VACUUM, CREATE INDEX, etc.
maintenance_work_mem = 320MB

# per sort/hash operation — can stack per query
work_mem = 6301kB

# WAL write buffer
wal_buffers = 16MB

min_wal_size = 1GB
max_wal_size = 4GB

# spread checkpoint writes over 90% of interval
checkpoint_completion_target = 0.9

# planner stat detail; raise to 200+ for skewed columns
default_statistics_target = 100

# near-sequential cost on SSD (default 4.0)
random_page_cost = 1.1

# concurrent I/O requests — high for SSD
effective_io_concurrency = 200

huge_pages = off

# disabled; enable if running heavy analytics
jit = off

# compress WAL — requires --with-lz4
wal_compression = lz4

# async I/O — requires --with-liburing
io_method = io_uring


# =============================================================================
# PARALLEL QUERY
# =============================================================================

# total background workers; match physical CPU count
max_worker_processes = 4

# don't let PG consume all cores under parallel load
max_parallel_workers = 2

# 1 extra worker per query node is enough on a shared server
max_parallel_workers_per_gather = 1

# background maintenance; 1 is sufficient
max_parallel_maintenance_workers = 1


# =============================================================================
# AUTOVACUUM
# =============================================================================

# more workers for concurrent table maintenance
autovacuum_max_workers = 3

# check for work every 30s instead of 60s
autovacuum_naptime = 30s

# trigger vacuum at 5% dead tuples (default 20%)
autovacuum_vacuum_scale_factor = 0.05

# trigger analyze at 2% changes (default 10%)
autovacuum_analyze_scale_factor = 0.02

# throttle less aggressively on SSD (default 20ms)
autovacuum_vacuum_cost_delay = 2ms

# log autovacuum runs slower than 250ms
log_autovacuum_min_duration = 250ms


# =============================================================================
# SESSION SAFETY
# =============================================================================

# kill sessions stuck in open transactions
idle_in_transaction_session_timeout = 30s

# abort if waiting on a lock beyond 5s
lock_timeout = 5s

# kill runaway queries; tune it based on slowest query
statement_timeout = 60s


# =============================================================================
# LOGGING & OBSERVABILITY
# =============================================================================

# log queries taking longer than 500ms
log_min_duration_statement = 500

# log checkpoint activity and timing
log_checkpoints = on

# log when a session waits on a lock
log_lock_waits = on

# log all temp file creation (0 = all sizes)
log_temp_files = 0


# =============================================================================
# EXTENSIONS
# =============================================================================

# must restart to take effect
shared_preload_libraries = 'pg_stat_statements'

# track all statements including nested
pg_stat_statements.track = all

# max distinct statements tracked
pg_stat_statements.max = 10000